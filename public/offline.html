<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b35">
  <title>Rail Darpan - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f6fb;
      color: #17243a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border: 1px solid #e1e7f0;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(20,43,75,.08);
    }
    img { width: 76px; height: 76px; object-fit: contain; }
    h1 { margin: 16px 0 8px; font-size: 25px; }
    p { color: #65748b; line-height: 1.7; font-size: 14px; }
    a {
      display: inline-block;
      margin-top: 14px;
      padding: 13px 22px;
      border-radius: 10px;
      background: #1459d9;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Rail Darpan">
    <h1>You are offline</h1>
    <p>
      Internet connection is unavailable. Connect to the internet to view
      current train running status, PNR information and live railway updates.
    </p>
    <a href="/">Try Again</a>
  </main>
</body>
</html>
